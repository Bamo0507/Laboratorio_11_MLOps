# Todas las rutas se interpretan desde la carpeta que contiene este archivo.
[rutas]
entrenamiento = "data/raw/lab1/entrenamiento.csv"
prueba = "data/raw/lab1/prueba.csv"
procesados = "data/processed"
publicaciones = "data/processed/publicaciones"
mlflow = "data/processed/mlflow"
ingesta = "data/processed/01_ingesta.csv"
reporte_ingesta = "data/processed/01_ingesta.json"
validado = "data/processed/02_validado.csv"
reporte_validacion = "data/processed/02_validacion.json"
serie_mensual = "data/processed/03_serie_mensual.csv"
ajuste = "data/processed/03_ajuste.csv"
evaluacion = "data/processed/03_evaluacion.csv"
reporte_preparacion = "data/processed/03_preparacion.json"
modelo_ajustado = "data/processed/04_modelo_sarima.pkl"
reporte_ajuste = "data/processed/04_ajuste.json"
comparacion = "data/processed/05_comparacion.csv"
reporte_evaluacion = "data/processed/05_evaluacion.json"

[ingesta]
codificacion = "utf-8-sig"
separador = ","
columna_origen = "archivo_origen"
granularidad_fuente = "mensual"

[calidad]
formato_fecha = "%Y-%m-%d"
marcadores_ausencia = ["", "NA", "NaN", "NULL", "None", "N/A", "sin dato"]
limite_ejemplos = 5
tipos_fuente = ["Turista", "Excursionista"]
clave_revision_parcial = ["Fecha", "Vía", "Frontera", "País", "Tipo de Viajero"]

[preparacion]
tolerancia_relativa_suma = 1e-12
tolerancia_absoluta_suma = 1e-6

[periodos]
inicio_ajuste = "2023-01"
fin_ajuste = "2025-12"
inicio_evaluacion = "2026-01"
fin_evaluacion = "2026-06"

[poblacion]
destino = "Guatemala"
unidad = "llegadas_por_mes"
tipos_incluidos = ["Turista", "Excursionista"]
paises_excluidos = ["Guatemala"]

[modelo]
nombre = "sarima"
orden = [0, 1, 0]
orden_estacional = [1, 1, 0, 12]
transformacion = "log"
tendencia = "n"
exigir_estacionariedad = true
exigir_invertibilidad = true
metodo_optimizacion = "lbfgs"
iteraciones_maximas = 200

# Regla fijada antes de calcular errores. El empate no supera la referencia.
[evaluacion]
regla = "mae_y_rmse_estrictamente_menores"

[referencia]
nombre = "mismo_mes_anio_anterior"
rezago_meses = 12

[columnas]
fecha = "Fecha"
anio = "Año"
mes = "Mes cod"
pais = "País"
tipo = "Tipo de Viajero"
valor = "Viajero"
clave_registro = ["Fecha", "Vía", "Frontera", "País", "Tipo de Viajero", "Agrupación Residencia"]
opcionales = ["pandemia", "Región", "Región dos", "Regiones OMT", "MCEO"]
